repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format .
        language: system
        types: [python]

      - id: ruff-check
        name: ruff check
        entry: uv run ruff check . --fix
        language: system
        types: [python]
        pass_filenames: false

      - id: pytest
        name: pytest
        entry: .venv/bin/python -m pytest -q
        language: system
        types: [python]
        pass_filenames: false

      - id: bench
        name: bench
        entry: bash -c 'timeout 300 .venv/bin/python scripts/bench.py --if-changed && git add docs/BENCHMARK.md docs/bench-history.jsonl || echo "[bench] 跳过：网络不可用或超时，文档保留上次结果"'
        language: system
        files: ^(src/.*\.py|scripts/bench\.py)$
        pass_filenames: false
