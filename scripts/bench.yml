# 站内爬取用例（crawl_site 快速 BFS）：字段 group/url/depth/pages
# 判定：成功页 ≥ 3 算符合预期（入口失败/只拿到入口一页都算退化）
sites:
  - group: 工具文档-Python docs
    url: https://docs.python.org/3/library/asyncio.html
    depth: 1
    pages: 5
  # 多层 BFS：第 2 层从已爬页的 Markdown 里继续发现链接
  - group: 工具文档-Python docs 多层
    url: https://docs.python.org/3/library/asyncio.html
    depth: 2
    pages: 10

