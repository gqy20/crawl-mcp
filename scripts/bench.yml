# bench 数据集 —— 改这里就够了，不用动 scripts/bench.py
#
# 爬取用例字段：
#   group: 渠道分组（表格按它聚合）
#   url:   目标 URL
#   expect: null          → 期望成功，正文 ≥ 200 字
#          "http_404"     → 期望失败，error_code 匹配（已知问题站点的回归用例）
#          ["a", "b"]     → 期望失败，error_code 命中其一
#   expect_text: "短语"   → 成功时正文必须包含该短语（可给列表）。
#                          只看字数会漏「抓到了但抓错了」，选稳定出现在正文的
#                          关键词（产品名/核心技术词），列表页/内容每天变的别配
#
# 用例类型对照公开 benchmark 的网站池：学术/政府/代码/工具文档（TRACE、WCEB），
# 电商/论坛/新闻/SaaS/招聘（WCXB 七类页面、TRACE 九大类）——都是他们点名测的类别。
#
# quick 里的用例每次 pre-commit / 会话结束都会跑（保持精简、偏快）；
# full_extra 只在 --full 时追加。
# 已知问题用例不是要跑通，而是要保证「失败得对」——error_code 变了就是判定逻辑退化。

